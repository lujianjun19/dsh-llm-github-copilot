name: Release

# Push a vX.Y.Z tag to build, test, and publish to npm via Trusted Publishing (OIDC).
# No NPM_TOKEN secret required — npm authenticates via GitHub Actions OIDC.
# Trusted Publisher must be configured on npmjs.com first:
#   https://www.npmjs.com/package/@lujianjun19/dsh-llm-github-copilot → Settings → Trusted publishing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # required for npm Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Install step: no registry-url so setup-node does NOT inject _authToken
      # into .npmrc (which would shadow OIDC auth on the publish step).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Debug npm auth config
        run: |
          echo '=== ~/.npmrc ===' && cat ~/.npmrc 2>/dev/null || echo '(empty)'
          echo '=== project .npmrc ===' && cat .npmrc 2>/dev/null || echo '(empty)'
          echo '=== npm config list ===' && npm config list
          echo '=== OIDC env ===' && printenv | grep -i 'ACTIONS_ID_TOKEN\|NODE_AUTH' || echo '(none)'

      # Publish step: wipe any .npmrc injected by setup-node (which contains
      # always-auth=true and an empty _authToken placeholder that prevent the
      # npm CLI from falling through to OIDC token exchange). Write a minimal
      # registry-only config and let npm detect the GitHub OIDC environment
      # automatically via ACTIONS_ID_TOKEN_REQUEST_URL.
      - name: Publish to npm (Trusted Publishing — no token)
        run: |
          rm -f ~/.npmrc
          echo 'registry=https://registry.npmjs.org/' > ~/.npmrc
          npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-llm-github-copilot $GITHUB_REF_NAME" \
            --notes "Published to npm as \`@lujianjun19/dsh-llm-github-copilot@${GITHUB_REF_NAME#v}\`

          **Install:**
          \`\`\`sh
          dsh plugin --profile web add @lujianjun19/dsh-llm-github-copilot
          \`\`\`

          See [CHANGELOG.md](https://github.com/lujianjun19/dsh-llm-github-copilot/blob/main/CHANGELOG.md) for details."
