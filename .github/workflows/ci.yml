name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Harness ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        harness: ['0.2.0-rc.2', '0.2.1-rc.2', '0.2.1-rc.3']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check release files
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Packed installation and browser smoke test
        run: npm run test:harness -- ${{ matrix.harness }}
